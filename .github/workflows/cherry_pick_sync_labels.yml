name: Cherry-pick label synchronization

on:
  workflow_dispatch:
    inputs:
      train_id:
        description: Train whose configured labels would be synchronized
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    if: ${{ github.repository == 'LOCAL_REVIEW_REMOTE_WRITES_DISABLED' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out automation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Fetch immutable cherry-pick configuration
        id: config
        run: |
          python3 -m scripts.cherry_pick.control_plane_cli action-fetch-config \
            --api https://developer-central.amd.com \
            --output "$RUNNER_TEMP/cherry-pick-config.json" \
            | tee "$RUNNER_TEMP/cherry-pick-config-metadata.json"
          python3 -c 'import json,os; value=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "cherry-pick-config-metadata.json"))); print("sha256=" + value["configuration_sha256"])' \
            >> "$GITHUB_OUTPUT"
      - name: Create issue-only token
        id: label-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.ROCM_CHERRYPICK_APP_CLIENT_ID }}
          private-key: ${{ secrets.ROCM_CHERRYPICK_APP_PRIVATE_KEY }}
          owner: ROCm
          repositories: |
            TheRock
            rocm-systems
            rocm-libraries
          permission-issues: write
      - name: Future capability-gated synchronization
        env:
          GITHUB_TOKEN: ${{ steps.label-token.outputs.token }}
          CONFIG_SHA: ${{ steps.config.outputs.sha256 }}
        run: |
          python3 -m scripts.cherry_pick \
            --config-snapshot "$RUNNER_TEMP/cherry-pick-config.json" \
            --expected-config-sha256 "$CONFIG_SHA" \
            action-sync-labels \
            --train "${{ inputs.train_id }}"
