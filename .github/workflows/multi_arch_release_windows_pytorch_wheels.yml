name: Multi-Arch Release Windows PyTorch Wheels

on:
  workflow_dispatch:
    inputs:
      amdgpu_families:
        description: >-
          Semicolon-separated list of AMD GPU families to build PyTorch for
          (e.g. 'gfx110X-all;gfx120X-all').
        type: string
        required: true
      rocm_version:
        description: ROCm package version to install and build against (e.g. 7.10.0.dev0)
        type: string
        required: true
      rocm_package_find_links_url:
        description: URL for pip --find-links to install ROCm packages
        type: string
        required: true
      release_type:
        description: 'Release type: "dev", "nightly", or "prerelease". Selects the S3 bucket.'
        type: choice
        options:
          - dev
          - nightly
          - prerelease
        default: dev
      cache_type:
        description: "Compiler cache type"
        type: choice
        options:
          - none
          - sccache
          - ccache
        default: none
      ref:
        description: "Branch, tag or SHA to checkout. Defaults to the reference or SHA that triggered the workflow."
        type: string
        default: ''
      python_version:
        description: "Single Python version to build (empty for full matrix)"
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

run-name: Multi-Arch Release Windows PyTorch Wheels (${{ inputs.amdgpu_families }}, ${{ inputs.release_type }}, ${{ inputs.rocm_version }})

jobs:
  notify_quartz_start:
    name: "Quartz - started - release PyTorch wheels (rockrel)"
    if: ${{ vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: ROCm/Quartz/.github/actions/notify_quartz@main
        with:
          run_phase: started
          reporting_workflow: multi_arch_release_windows_pytorch_wheels.yml
          workflow_inputs: ${{ toJSON(inputs) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}

  release:
    uses: ROCm/TheRock/.github/workflows/multi_arch_release_windows_pytorch_wheels.yml@main
    with:
      amdgpu_families: ${{ inputs.amdgpu_families }}
      rocm_version: ${{ inputs.rocm_version }}
      rocm_package_find_links_url: ${{ inputs.rocm_package_find_links_url }}
      release_type: ${{ inputs.release_type }}
      cache_type: ${{ inputs.cache_type }}
      repository: "ROCm/TheRock"
      ref: ${{ inputs.ref || '' }}
      python_version: ${{ inputs.python_version }}

  notify_quartz_completed:
    name: "Quartz - completed - release PyTorch wheels (rockrel)"
    if: ${{ always() && vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
    needs: [release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: ROCm/Quartz/.github/actions/notify_quartz@main
        with:
          run_phase: completed
          reporting_workflow: multi_arch_release_windows_pytorch_wheels.yml
          workflow_inputs: ${{ toJSON(inputs) }}
          workflow_captured_outputs: ${{ toJSON(needs) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}
