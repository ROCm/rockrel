name: Cherry-pick reconciliation

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      automation_ref:
        description: Full immutable rockrel commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  discover:
    name: Discover active trains
    runs-on: ubuntu-24.04
    outputs:
      trains: ${{ steps.trains.outputs.value }}
    steps:
      - name: Check out pinned automation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.automation_ref || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Select shadow and create-draft trains
        id: trains
        run: >-
          python3 -c 'import json; value=json.load(open("config/cherry-pick-trains.json")); print("value=" + json.dumps([{"id": item["id"], "mode": item["mode"]} for item in value["trains"] if item["state"] == "active" and item["mode"] in {"shadow", "create-draft"}]))'
          >> "$GITHUB_OUTPUT"

  reconcile:
    name: Reconcile read-only plans
    needs: discover
    if: needs.discover.outputs.trains != '[]'
    strategy:
      fail-fast: false
      matrix:
        train: ${{ fromJSON(needs.discover.outputs.trains) }}
    concurrency:
      group: cherry-pick-reconcile-${{ matrix.train.id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - name: Create scoped read token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.ROCM_CHERRYPICK_APP_CLIENT_ID }}
          private-key: ${{ secrets.ROCM_CHERRYPICK_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
      - name: Check out pinned automation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.automation_ref || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Record read-only reconciliation mode
        run: 'echo "mode: plan; train=${{ matrix.train.id }}"'

  create-drafts:
    name: Future reconciliation writes
    if: ${{ github.repository == 'LOCAL_REVIEW_REMOTE_WRITES_DISABLED' }}
    needs: reconcile
    runs-on: ubuntu-24.04
    steps:
      - name: Create future write token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.ROCM_CHERRYPICK_APP_CLIENT_ID }}
          private-key: ${{ secrets.ROCM_CHERRYPICK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Check out pinned automation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.automation_ref || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Future capability-gated write
        run: python3 -m scripts.cherry_pick reconcile --create-drafts --help
