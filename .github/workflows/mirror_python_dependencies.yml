# Existing objects are refreshed so each stream's lifecycle rule does not
# expire the current dependency versions.

name: Mirror Python Dependencies

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      publish_stream:
        description: >-
          Stream to publish to. "all" publishes to dev and nightly, like the
          scheduled run.
        type: choice
        options:
          - all
          - dev
          - nightly
          - bkc
          - rc
        default: all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror Python Dependencies (${{ inputs.publish_stream || 'all' }})
    if: ${{ github.repository == 'ROCm/rockrel' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # Assume the stream publication roles via OIDC.
    env:
      # Space-separated streams; "all" is dev and nightly.
      PUBLISH_STREAMS: ${{ (inputs.publish_stream || 'all') == 'all' && 'dev nightly' || inputs.publish_stream }}
      SNAPSHOT_DIR: ${{ github.workspace }}/rocm-dependency-snapshot
      MIRROR_SCRIPT: build_tools/packaging/python/mirror_python_dependencies.py

    steps:
      - name: Checkout TheRock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ROCm/TheRock
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python requirements
        run: pip install -r requirements.txt

      - name: Resolve dependency snapshot
        run: |
          python "${MIRROR_SCRIPT}" resolve \
            --output-dir "${SNAPSHOT_DIR}" \
            --source-revision "$(git rev-parse HEAD)" \
            --summary-file "${GITHUB_STEP_SUMMARY}"

      - name: Configure AWS Credentials for dev
        if: ${{ contains(env.PUBLISH_STREAMS, 'dev') }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::324352301041:role/therock-repo-dev-core
          aws-profile: mirror-dev

      - name: Configure AWS Credentials for nightly
        if: ${{ contains(env.PUBLISH_STREAMS, 'nightly') }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::324352301041:role/therock-repo-nightly-core
          aws-profile: mirror-nightly

      - name: Configure AWS Credentials for bkc
        if: ${{ contains(env.PUBLISH_STREAMS, 'bkc') }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::324352301041:role/therock-repo-bkc-core
          aws-profile: mirror-bkc

      - name: Configure AWS Credentials for rc
        if: ${{ contains(env.PUBLISH_STREAMS, 'rc') }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::324352301041:role/therock-repo-rc-core
          aws-profile: mirror-rc

      - name: Publish dependency snapshot
        run: |
          for stream in ${PUBLISH_STREAMS}; do
            AWS_PROFILE="mirror-${stream}" python "${MIRROR_SCRIPT}" publish \
              --snapshot-dir "${SNAPSHOT_DIR}" \
              --bucket "therock-repo-amd-${stream}-core" \
              --refresh-existing \
              --summary-file "${GITHUB_STEP_SUMMARY}"
          done
