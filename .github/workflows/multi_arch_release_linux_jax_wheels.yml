name: Multi-Arch Release Linux JAX Wheels

on:
  workflow_dispatch:
    inputs:
      test_amdgpu_family:
        description: "GPU family to use for JAX tests; empty means skip tests."
        type: string
        default: ""
      release_type:
        description: 'Release type: "dev", "dev-bkc", "nightly", "nightly-bkc", or "prerelease".'
        type: choice
        options:
          - dev
          - dev-bkc
          - nightly
          - nightly-bkc
          - prerelease
        default: dev
      rocm_version:
        description: "ROCm package version to build against."
        type: string
        required: true
      rocm_package_find_links_url:
        description: "URL for pip --find-links to install ROCm packages for the JAX manylinux build."
        type: string
        default: ""
      ref:
        description: "Branch, tag, or SHA to checkout."
        type: string
        default: ""
      repository:
        description: "Repository to checkout. Defaults to ROCm/TheRock."
        type: string
        default: "ROCm/TheRock"
      python_version:
        description: "Single Python version to build (empty for full matrix)"
        type: string
        default: ''
      quartz_tracking_id:
        description: >-
          Leave empty. Internal Quartz tracking id, set automatically to link
          this run to its release lineage.
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

run-name: Multi-Arch Release Linux JAX Wheels (${{ inputs.release_type }}, ${{ inputs.rocm_version }}, Multiarch)

jobs:
  notify_quartz_start:
    name: "Quartz - started - release JAX wheels (rockrel)"
    if: ${{ vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f # notify_quartz/v1.1.1
        with:
          run_phase: started
          reporting_workflow: multi_arch_release_linux_jax_wheels.yml
          workflow_inputs: ${{ toJSON(inputs) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}

  build_jax_wheels:
    uses: ROCm/TheRock/.github/workflows/multi_arch_release_linux_jax_wheels.yml@users/marbre/release_repo_amd_bucket_rewire
    secrets: inherit
    with:
      test_amdgpu_family: ${{ inputs.test_amdgpu_family }}
      release_type: ${{ inputs.release_type }}
      rocm_version: ${{ inputs.rocm_version }}
      rocm_package_find_links_url: ${{ inputs.rocm_package_find_links_url }}
      repository: ${{ inputs.repository || 'ROCm/TheRock' }}
      ref: ${{ inputs.ref || '' }}
      python_version: ${{ inputs.python_version }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}

  notify_quartz_completed:
    name: "Quartz - completed - release JAX wheels (rockrel)"
    if: ${{ always() && vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
    needs: [build_jax_wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f # notify_quartz/v1.1.1
        with:
          run_phase: completed
          reporting_workflow: multi_arch_release_linux_jax_wheels.yml
          workflow_inputs: ${{ toJSON(inputs) }}
          workflow_captured_outputs: ${{ toJSON(needs) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}
