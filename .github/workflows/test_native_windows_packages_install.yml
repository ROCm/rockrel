# Thin wrapper that dispatches to TheRock's test_native_windows_packages_install.yml.
# This exists so that release workflows running in rockrel's context can dispatch
# native Windows MSI package install tests to TheRock.

name: Test Native Windows Packages Install

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Run id whose published Windows MSIs to install and verify."
        required: true
        type: string
      artifact_github_repo:
        description: "GitHub repository that owns artifact_run_id."
        type: string
        default: ROCm/TheRock
      packages:
        description: "Packages to test, comma-separated (e.g. 'runtime,core')."
        type: string
        default: runtime
      rocm_version:
        description: "ROCm version stamped on the MSI (e.g. '10.2.0')."
        required: true
        type: string
      release_type:
        description: "Release type selecting the source artifacts bucket."
        type: string
        default: ci
      run_uninstall:
        description: "Also uninstall and verify a clean teardown."
        type: boolean
        default: true
      repository:
        description: "Repository to checkout. Defaults to ROCm/TheRock."
        type: string
        default: "ROCm/TheRock"
      ref:
        description: "Branch, tag, or SHA to checkout. Defaults to the triggering ref."
        type: string
        default: ""
      quartz_tracking_id:
        description: >-
          Leave empty. Internal Quartz tracking id, set automatically by the
          top-level orchestrator to link this run to its release lineage. Do not
          set it manually.
        type: string
        default: ""

permissions:
  contents: read

run-name: Test Native Windows Packages Install (${{ inputs.packages }}, ${{ inputs.rocm_version }}, ${{ inputs.release_type }})

jobs:
  notify_quartz_start:
    name: "Quartz - started - test MSI install (rockrel)"
    if: ${{ vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f # notify_quartz/v1.1.1
        with:
          run_phase: started
          reporting_workflow: test_native_windows_packages_install.yml
          workflow_inputs: ${{ toJSON(inputs) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}

  test:
    uses: ROCm/TheRock/.github/workflows/test_native_windows_packages_install.yml@release/bkc/therock-10.3-20261027
    permissions:
      contents: read
      id-token: write
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      artifact_run_id: ${{ inputs.artifact_run_id }}
      artifact_github_repo: ${{ inputs.artifact_github_repo }}
      packages: ${{ inputs.packages }}
      rocm_version: ${{ inputs.rocm_version }}
      release_type: ${{ inputs.release_type }}
      run_uninstall: ${{ inputs.run_uninstall }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}

  notify_quartz_completed:
    name: "Quartz - completed - test MSI install (rockrel)"
    if: ${{ always() && vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f # notify_quartz/v1.1.1
        with:
          run_phase: completed
          reporting_workflow: test_native_windows_packages_install.yml
          workflow_inputs: ${{ toJSON(inputs) }}
          workflow_captured_outputs: ${{ toJSON(needs) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}
