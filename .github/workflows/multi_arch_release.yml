name: Multi-Arch Release

# Expected triggers:
#
# Release type | Trigger details
# ------------ | --------------------------------------------------------------
# dev          | "workflow_dispatch" for testing with any set of inputs
# dev-bkc      | "workflow_dispatch" for BKC development builds
# nightly      | "schedule", or "workflow_dispatch" as needed (default inputs)
# nightly-bkc  | "workflow_dispatch" for BKC nightly builds
# prerelease   | "workflow_dispatch" for stable releases (explicit GPU family lists?)

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type: "dev", "dev-bkc", "nightly", "nightly-bkc", or "prerelease".'
        type: choice
        options:
          - dev
          - dev-bkc
          - nightly
          - nightly-bkc
          - prerelease
        default: dev
      prerelease_version:
        description: "(Optional) Prerelease version number, e.g. '2' for 7.10.0rc2"
        type: string
        default: ""
      linux_amdgpu_families:
        description: 'Linux GPU families. "all" = all, "none" = skip Linux.'
        type: string
        default: "all"
      windows_amdgpu_families:
        description: 'Windows GPU families. "all" = all, "none" = skip Windows.'
        type: string
        default: "all"
      ref:
        description: "TheRock branch, tag, or SHA. Empty = default branch."
        type: string
        default: ""
      # Enable Quartz release-lineage tracking. When on, TheRock propagates this
      # run's id to every triggered workflow as quartz_tracking_id, formatted as
      # "<github.run_id>;<release_type>". Scheduled nightly runs always enable it.
      enable_quartz_tracking:
        description: "Enable Quartz release-lineage tracking (on by default)."
        type: boolean
        default: true

  # Trigger on a schedule to build nightly releases.
  schedule:
    # Runs at 12:00 AM UTC, which is 5:00 PM PDT (UTC-7)
    - cron: '0 00 * * *'

permissions:
  contents: read

run-name: >-
  Multi-Arch Release (${{ inputs.release_type || 'nightly' }})
  | Linux: ${{ inputs.linux_amdgpu_families || 'all' }}
  | Windows: ${{ inputs.windows_amdgpu_families || 'all' }}

jobs:
  notify_quartz_start:
    name: "Quartz - started - release (rockrel)"
    if: ${{ vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f # notify_quartz/v1.1.1
        with:
          run_phase: started
          reporting_workflow: multi_arch_release.yml
          workflow_inputs: ${{ toJSON(inputs) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}

  release:
    uses: ROCm/TheRock/.github/workflows/multi_arch_release.yml@users/marbre/release_repo_amd_bucket_rewire
    secrets: inherit
    with:
      release_type: ${{ inputs.release_type || 'nightly' }}
      prerelease_version: ${{ inputs.prerelease_version || '' }}
      linux_amdgpu_families: ${{ inputs.linux_amdgpu_families || 'all' }}
      windows_amdgpu_families: ${{ inputs.windows_amdgpu_families || 'all' }}
      run_full_pytorch_tests: ${{ github.event_name == 'schedule' || inputs.release_type == 'prerelease' }}
      repository: "ROCm/TheRock"
      ref: ${{ inputs.ref || '' }}
      enable_quartz_tracking: ${{ github.event_name == 'schedule' || inputs.enable_quartz_tracking }}
    permissions:
      contents: write
      actions: write
      id-token: write

  notify_quartz_completed:
    name: "Quartz - completed - release (rockrel)"
    if: ${{ always() && vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
    needs: [release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f # notify_quartz/v1.1.1
        with:
          run_phase: completed
          reporting_workflow: multi_arch_release.yml
          workflow_inputs: ${{ toJSON(inputs) }}
          workflow_captured_outputs: ${{ toJSON(needs) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}
