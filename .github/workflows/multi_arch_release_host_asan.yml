name: Multi-Arch Release Host-ASAN

# Host-ASAN builds run 2x/week (Tuesdays and Thursdays) with testing on GFX942.
# This catches host-side memory issues without the overhead of daily runs.
#
# Expected triggers:
#
# Release type | Trigger details
# ------------ | --------------------------------------------------------------
# dev          | "workflow_dispatch" for testing with any set of inputs
# nightly      | "schedule" (Tue/Thu), or "workflow_dispatch" as needed

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type: "dev" or "nightly".'
        type: choice
        options:
          - dev
          - nightly
        default: dev
      linux_amdgpu_families:
        description: 'Linux GPU families. "all" = all, "none" = skip Linux.'
        type: string
        default: "gfx94x"
      ref:
        description: "TheRock branch, tag, or SHA. Empty = default branch."
        type: string
        default: ""
      build_pytorch:
        description: "Build PyTorch wheels"
        type: boolean
        default: false
      python_version:
        description: "Single Python version for wheel builds (empty for full matrix)"
        type: string
        default: ""

  # Trigger on Tuesdays and Thursdays at 12:00 AM UTC (5:00 PM PDT)
  schedule:
    - cron: '0 0 * * 2,4'

permissions:
  contents: read

run-name: >-
  Multi-Arch Release Host-ASAN (${{ inputs.release_type || 'nightly' }})
  | Linux: ${{ inputs.linux_amdgpu_families || 'gfx94x' }}

jobs:
  setup:
    uses: ROCm/TheRock/.github/workflows/setup_multi_arch.yml@main
    with:
      build_variant: "host-asan"
      release_type: ${{ inputs.release_type || 'nightly' }}
      linux_amdgpu_families: ${{ inputs.linux_amdgpu_families || 'gfx94x' }}
      windows_amdgpu_families: "none"
      build_pytorch: false
      build_jax: false
      python_version: ${{ inputs.python_version || '' }}
      repository: "ROCm/TheRock"
      ref: ${{ inputs.ref || '' }}
    secrets: inherit

  linux_release:
    name: Linux::host-asan
    needs: setup
    if: ${{ needs.setup.outputs.linux_build_config != '' }}
    uses: ROCm/TheRock/.github/workflows/multi_arch_release_linux.yml@main
    secrets: inherit
    with:
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      rocm_deb_package_version: ${{ needs.setup.outputs.rocm_deb_package_version }}
      rocm_rpm_package_version: ${{ needs.setup.outputs.rocm_rpm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      release_type: ${{ inputs.release_type || 'nightly' }}
      repository: "ROCm/TheRock"
      ref: ${{ needs.setup.outputs.ref }}
      run_full_pytorch_tests: false
      build_pytorch: ${{ inputs.build_pytorch || false }}
      build_jax: false
      python_version: ${{ inputs.python_version || '' }}
      build_variant: "host-asan"
    permissions:
      contents: read
      actions: write
      id-token: write
