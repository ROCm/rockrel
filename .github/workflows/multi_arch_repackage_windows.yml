name: Multi-Arch Repackage Windows

on:
  workflow_call:
    inputs:
      release_type:
        type: string
        required: true
      prerelease_version:
        type: string
        default: ""
      prebuilt_prefix:
        type: string
        required: true
      amdgpu_families:
        type: string
        required: true
      ref:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  noop:
    name: Repackage Windows (dummy)
    runs-on: ubuntu-24.04
    steps:
      - name: Show inputs
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          PRERELEASE_VERSION: ${{ inputs.prerelease_version }}
          PREBUILT_PREFIX: ${{ inputs.prebuilt_prefix }}
          AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
          REF: ${{ inputs.ref }}
        run: |
          echo "release_type=${RELEASE_TYPE}"
          echo "prerelease_version=${PRERELEASE_VERSION}"
          echo "prebuilt_prefix=${PREBUILT_PREFIX}"
          echo "amdgpu_families=${AMDGPU_FAMILIES}"
          echo "ref=${REF}"
