name: Unit Tests

on:
  push:
    branches:
      - main
      - release/therock-*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit_tests:
    name: "Unit Tests :: ${{ matrix.runs-on }}"
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.5.0
        with:
          python-version: "3.12"

      - name: Install python deps
        run: pip install -r requirements-test.txt

      - name: Test scripts
        run: |
          python -m pytest -vv --durations=20 \
            --cov --cov-report=term-missing --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: coverage-report-${{ matrix.runs-on }}
          path: scripts/htmlcov/

  unit_tests_summary:
    name: Unit Tests Summary
    if: always()
    needs:
      - unit_tests
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate workflow results
        env:
          UNIT_TESTS_RESULT: ${{ needs.unit_tests.result }}
        run: |
          echo "unit_tests result: $UNIT_TESTS_RESULT"
          if [[ "$UNIT_TESTS_RESULT" != "success" ]]; then
            echo "Unit tests failed or were cancelled."
            exit 1
          fi
          echo "All unit tests passed."
