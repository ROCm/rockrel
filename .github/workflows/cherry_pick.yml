name: Cherry-pick request

on:
  workflow_call:
    inputs:
      source_pr:
        description: Canonical GitHub source pull request URL
        required: true
        type: string
      automation_ref:
        description: Full immutable rockrel commit SHA
        required: true
        type: string
      event_action:
        description: Source pull request event action
        required: true
        type: string
      event_label:
        description: Label affected by this event
        required: false
        default: ""
        type: string
      labels_json:
        description: JSON array of current canonical PR labels
        required: false
        default: "[]"
        type: string
      train_id:
        description: Optional manual destination train
        required: false
        default: ""
        type: string
    secrets:
      ROCM_CHERRYPICK_APP_CLIENT_ID:
        required: true
      ROCM_CHERRYPICK_APP_PRIVATE_KEY:
        required: true
      ROCM_CHERRYPICK_JIRA_URL:
        required: false
      ROCM_CHERRYPICK_JIRA_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      source_pr:
        description: Canonical GitHub source pull request URL
        required: true
        type: string
      train_id:
        description: Destination train configuration ID
        required: true
        type: string
      automation_ref:
        description: Full immutable rockrel commit SHA
        required: true
        type: string
      event_action:
        description: Read-only manual planning
        required: true
        default: manual
        type: choice
        options: [manual]
      event_label:
        required: false
        default: ""
        type: string
      labels_json:
        required: false
        default: "[]"
        type: string

permissions:
  contents: read

jobs:
  discover:
    name: Resolve configured destination trains
    runs-on: ubuntu-24.04
    outputs:
      trains: ${{ steps.discover.outputs.trains }}
    steps:
      - name: Check out pinned automation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ROCm/rockrel
          ref: ${{ inputs.automation_ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Discover trains centrally
        id: discover
        env:
          LABELS_JSON: ${{ inputs.labels_json }}
          EVENT_ACTION: ${{ inputs.event_action }}
          EVENT_LABEL: ${{ inputs.event_label }}
          MANUAL_TRAIN: ${{ inputs.train_id }}
        run: |
          if [[ -n "$MANUAL_TRAIN" ]]; then
            python3 -c 'import json,os; print("trains=" + json.dumps([os.environ["MANUAL_TRAIN"]]))' >> "$GITHUB_OUTPUT"
          else
            python3 -m scripts.cherry_pick discover \
              --labels-json "$LABELS_JSON" \
              --event-action "$EVENT_ACTION" \
              --event-label "$EVENT_LABEL" \
              | python3 -c 'import json,sys; print("trains=" + json.dumps(json.load(sys.stdin)["trains"]))' \
              >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: Plan ${{ matrix.train }}
    needs: discover
    if: needs.discover.outputs.trains != '[]'
    strategy:
      fail-fast: false
      matrix:
        train: ${{ fromJSON(needs.discover.outputs.trains) }}
    concurrency:
      group: cherry-pick-${{ inputs.source_pr }}-${{ matrix.train }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    outputs:
      status: ${{ steps.result.outputs.status }}
      train_mode: ${{ steps.result.outputs.train_mode }}
    steps:
      - name: Resolve source repository
        id: source
        env:
          SOURCE_PR: ${{ inputs.source_pr }}
        run: >-
          python3 -c 'import os,re; m=re.fullmatch(r"https://github.com/([^/]+)/([^/]+)/pull/[1-9][0-9]*/?", os.environ["SOURCE_PR"]); assert m; print(f"repository={m.group(1)}/{m.group(2)}"); print(f"name={m.group(2)}")'
          >> "$GITHUB_OUTPUT"
      - name: Create scoped read token
        id: read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.ROCM_CHERRYPICK_APP_CLIENT_ID }}
          private-key: ${{ secrets.ROCM_CHERRYPICK_APP_PRIVATE_KEY }}
          owner: ROCm
          repositories: ${{ steps.source.outputs.name }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
      - name: Check out pinned automation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ROCm/rockrel
          ref: ${{ inputs.automation_ref }}
          path: automation
          persist-credentials: false
      - name: Check out canonical repository history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ steps.source.outputs.repository }}
          token: ${{ steps.read-token.outputs.token }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Plan request
        env:
          GITHUB_TOKEN: ${{ steps.read-token.outputs.token }}
          JIRA_URL: ${{ secrets.ROCM_CHERRYPICK_JIRA_URL }}
          JIRA_TOKEN: ${{ secrets.ROCM_CHERRYPICK_JIRA_TOKEN }}
        working-directory: automation
        run: |
          python3 -m scripts.cherry_pick \
            --config config/cherry-pick-trains.json \
            plan \
            --source-pr "${{ inputs.source_pr }}" \
            --train "${{ matrix.train }}" \
            --repo-dir "$GITHUB_WORKSPACE/source" \
            --event-action "${{ inputs.event_action }}" \
            | tee "$RUNNER_TEMP/cherry-pick-plan.json"
      - name: Export decision
        id: result
        env:
          PLAN_FILE: ${{ runner.temp }}/cherry-pick-plan.json
        run: >-
          python3 -c 'import json,os; value=json.load(open(os.environ["PLAN_FILE"])); print("status=" + value["status"]); print("train_mode=" + value["evidence"]["train_mode"])'
          >> "$GITHUB_OUTPUT"

  feedback:
    name: Publish future event feedback
    if: ${{ github.repository == 'LOCAL_REVIEW_REMOTE_WRITES_DISABLED' }}
    needs: plan
    runs-on: ubuntu-24.04
    # Future gate also requires needs.plan.outputs.train_mode == 'create-draft'.
    steps:
      - name: Create issue-only token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.ROCM_CHERRYPICK_APP_CLIENT_ID }}
          private-key: ${{ secrets.ROCM_CHERRYPICK_APP_PRIVATE_KEY }}
          permission-issues: write

  create-draft:
    name: Create future draft
    if: ${{ github.repository == 'LOCAL_REVIEW_REMOTE_WRITES_DISABLED' }}
    needs: plan
    runs-on: ubuntu-24.04
    # Future gates require needs.plan.outputs.train_mode == 'create-draft' and
    # needs.plan.outputs.status == 'draft_planned'.
    steps:
      - name: Create draft-only App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.ROCM_CHERRYPICK_APP_CLIENT_ID }}
          private-key: ${{ secrets.ROCM_CHERRYPICK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
