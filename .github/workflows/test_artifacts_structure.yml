name: Test Artifact Structure

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "GitHub Actions run ID containing the artifacts"
        required: true
        type: string

      artifact_github_repo:
        description: "Repository containing the artifact run"
        required: false
        default: "ROCm/rockrel"
        type: string

      amdgpu_families:
        description: "Semicolon-separated GPU families, for example gfx94X-dcgpu;gfx120X-all"
        required: false
        default: ""
        type: string

      platform:
        description: "Artifact platform"
        required: false
        default: "linux"
        type: choice
        options:
          - linux
          - windows

      release_type:
        description: "Release type: ci or dev"
        required: false
        default: "ci"
        type: choice
        options:
          - ci
          - dev

      repository:
        description: "Repository containing the test code"
        required: false
        default: "ROCm/TheRock"
        type: string

      ref:
        description: "TheRock branch, tag, or SHA"
        required: false
        default: "main"
        type: string

  workflow_call:
    inputs:
      artifact_run_id:
        required: true
        type: string

      artifact_github_repo:
        required: false
        default: "ROCm/rockrel"
        type: string

      amdgpu_families:
        required: false
        default: ""
        type: string

      platform:
        required: false
        default: "linux"
        type: string

      release_type:
        required: false
        default: "ci"
        type: string

      repository:
        required: false
        default: "ROCm/TheRock"
        type: string

      ref:
        required: false
        default: "main"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    uses: ROCm/TheRock/.github/workflows/test_artifacts_structure.yml@main
    secrets: inherit
    with:
      artifact_run_id: ${{ inputs.artifact_run_id }}
      artifact_github_repo: ${{ inputs.artifact_github_repo }}
      amdgpu_families: ${{ inputs.amdgpu_families }}
      platform: ${{ inputs.platform }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
